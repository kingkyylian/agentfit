<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AgentFit terminal demo</title>
  <desc id="desc">A terminal-style demo showing AgentFit improving a stale AGENTS.md score from 65/100 to 93/100, then scoring its own repository 100/100.</desc>
  <rect width="1280" height="720" fill="#0d1117"/>
  <rect x="72" y="56" width="1136" height="608" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="104" cy="90" r="8" fill="#ff5f56"/>
  <circle cx="132" cy="90" r="8" fill="#ffbd2e"/>
  <circle cx="160" cy="90" r="8" fill="#27c93f"/>
  <text x="190" y="97" fill="#8b949e" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="18">agentfit demo</text>

  <text x="104" y="150" fill="#7ee787" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="24">$ npx @kingkyylian/agentfit@latest eval --adapter dry-run</text>
  <text x="104" y="194" fill="#f0f6fc" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="24">AgentFit score 65/100 (D).</text>
  <text x="104" y="232" fill="#ff7b72" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="22">Failed checks:</text>
  <text x="128" y="270" fill="#c9d1d9" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="21">- missing @docs/setup.md</text>
  <text x="128" y="304" fill="#c9d1d9" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="21">- stale pnpm lint command</text>
  <text x="128" y="338" fill="#c9d1d9" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="21">- no runnable verification command</text>
  <text x="128" y="372" fill="#c9d1d9" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="21">- missing packages/api/AGENTS.md</text>

  <text x="104" y="430" fill="#7ee787" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="24">$ agentfit compare demo-before.json demo-after.json</text>
  <text x="104" y="474" fill="#f0f6fc" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="25">AgentFit improved by 28 points: 65/100 (D) -&gt; 93/100 (A).</text>
  <text x="104" y="526" fill="#7ee787" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="24">$ agentfit eval --adapter dry-run --run-tasks</text>
  <text x="104" y="570" fill="#f0f6fc" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="25">AgentFit score 100/100 (A).</text>
  <text x="104" y="614" fill="#8b949e" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="22">Task execution: 5 of 5 generated task runs executed.</text>
</svg>

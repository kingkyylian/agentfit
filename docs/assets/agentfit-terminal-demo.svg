<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AgentFit terminal demo</title>
  <desc id="desc">An animated terminal-style demo showing AgentFit improving a stale AGENTS.md score from 65/100 to 93/100, comparing the delta, then scoring its own repository 100/100.</desc>
  <style>
    .term { font-family: SFMono-Regular, Consolas, Liberation Mono, monospace; }
    .line { opacity: 0; animation: reveal 13s infinite both; }
    .d1 { animation-delay: .2s; }
    .d2 { animation-delay: .7s; }
    .d3 { animation-delay: 1.2s; }
    .d4 { animation-delay: 1.7s; }
    .d5 { animation-delay: 2.2s; }
    .d6 { animation-delay: 2.7s; }
    .d7 { animation-delay: 3.2s; }
    .d8 { animation-delay: 4.6s; }
    .d9 { animation-delay: 5.1s; }
    .d10 { animation-delay: 5.6s; }
    .d11 { animation-delay: 7s; }
    .d12 { animation-delay: 7.5s; }
    .d13 { animation-delay: 8s; }
    .cursor { animation: blink 1s steps(1, end) infinite; }
    @keyframes reveal {
      0%, 4% { opacity: 0; transform: translateY(8px); }
      9%, 88% { opacity: 1; transform: translateY(0); }
      96%, 100% { opacity: 0; transform: translateY(0); }
    }
    @keyframes blink {
      0%, 48% { opacity: 1; }
      49%, 100% { opacity: 0; }
    }
  </style>
  <rect width="1280" height="720" fill="#0d1117"/>
  <rect x="72" y="56" width="1136" height="608" rx="14" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="104" cy="90" r="8" fill="#ff5f56"/>
  <circle cx="132" cy="90" r="8" fill="#ffbd2e"/>
  <circle cx="160" cy="90" r="8" fill="#27c93f"/>
  <text x="190" y="97" fill="#8b949e" class="term" font-size="18">agentfit demo</text>

  <text x="104" y="150" fill="#7ee787" class="term line d1" font-size="24">$ npx @kingkyylian/agentfit@latest eval --adapter dry-run</text>
  <text x="104" y="194" fill="#f0f6fc" class="term line d2" font-size="24">AgentFit score 65/100 (D).</text>
  <text x="104" y="232" fill="#ff7b72" class="term line d3" font-size="22">Failed checks:</text>
  <text x="128" y="270" fill="#c9d1d9" class="term line d4" font-size="21">- missing @docs/setup.md</text>
  <text x="128" y="304" fill="#c9d1d9" class="term line d5" font-size="21">- stale pnpm lint command</text>
  <text x="128" y="338" fill="#c9d1d9" class="term line d6" font-size="21">- no runnable verification command</text>
  <text x="128" y="372" fill="#c9d1d9" class="term line d7" font-size="21">- missing packages/api/AGENTS.md</text>

  <text x="104" y="424" fill="#7ee787" class="term line d8" font-size="24">$ agentfit eval examples/demo/fixed --adapter dry-run</text>
  <text x="104" y="468" fill="#f0f6fc" class="term line d9" font-size="25">AgentFit score 93/100 (A).</text>
  <text x="104" y="512" fill="#f0f6fc" class="term line d10" font-size="24">Compare delta: 65/100 (D) -&gt; 93/100 (A), +28 points.</text>

  <text x="104" y="560" fill="#7ee787" class="term line d11" font-size="24">$ agentfit eval --adapter dry-run --run-tasks</text>
  <text x="104" y="604" fill="#f0f6fc" class="term line d12" font-size="25">AgentFit score 100/100 (A).</text>
  <text x="104" y="640" fill="#8b949e" class="term line d13" font-size="22">Task execution: 5 of 5 generated task runs executed.</text>
  <rect x="762" y="622" width="13" height="25" fill="#7ee787" class="cursor"/>
</svg>

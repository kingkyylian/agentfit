<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">AgentFit social preview</title>
  <desc id="desc">AgentFit social preview: CI for AGENTS.md and coding-agent instructions.</desc>
  <rect width="1280" height="640" fill="#0d1117"/>
  <rect x="72" y="72" width="1136" height="496" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <text x="120" y="178" fill="#f0f6fc" font-family="Inter, Helvetica, Arial, sans-serif" font-size="78" font-weight="800">AgentFit</text>
  <text x="120" y="246" fill="#c9d1d9" font-family="Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="600">CI for AGENTS.md and coding-agent instructions</text>
  <text x="120" y="324" fill="#8b949e" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30">Catch stale commands, broken references, and missing nested agent docs.</text>

  <rect x="120" y="384" width="312" height="96" rx="14" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <text x="148" y="424" fill="#ff7b72" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="24">stale repo</text>
  <text x="148" y="462" fill="#f0f6fc" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="32">65/100 (D)</text>

  <text x="478" y="446" fill="#7ee787" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="42">-&gt;</text>

  <rect x="560" y="384" width="312" height="96" rx="14" fill="#21262d" stroke="#30363d" stroke-width="2"/>
  <text x="588" y="424" fill="#7ee787" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="24">fixed docs</text>
  <text x="588" y="462" fill="#f0f6fc" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="32">93/100 (A)</text>

  <rect x="936" y="384" width="178" height="96" rx="14" fill="#0f2d1f" stroke="#238636" stroke-width="2"/>
  <text x="970" y="424" fill="#7ee787" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="24">self</text>
  <text x="970" y="462" fill="#f0f6fc" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="30">100/100</text>

  <text x="120" y="536" fill="#8b949e" font-family="SFMono-Regular, Consolas, Liberation Mono, monospace" font-size="26">npx @kingkyylian/agentfit@latest eval --adapter dry-run</text>
</svg>
